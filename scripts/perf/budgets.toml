# niubash per-asset timing budgets — the release-gate teeth.
#
# Owner iron directive (2026-10-04): every plugin asset down to every theme
# FILE gets a measured time (scripts/perf/asset-timing.py), enforced at
# release. This file is DATA: adding an asset needs no code change — it is
# discovered and measured automatically, against its class's default budget.
#
# Phases (all measured per asset, N=3 median):
#   source_ms        `. <asset>` start -> prompt return (piped-interactive)
#   first_prompt_ms  rc load (bootstrap line) -> first prompt rendered
#                    (ConPTY window anchored inside the session: the
#                    winpty/conhost transport has a machine-dependent
#                    multi-second output floor that even `cmd /c echo` pays,
#                    so spawn-relative numbers would measure the transport;
#                    per-asset boot cost is reported separately as
#                    boot_median_ms)
#   rerender_ms      ENTER -> next prompt (the asset's PROMPT_COMMAND cost)
#
# ── Mandated targets (owner, 2026-10-04) ──────────────────────────────────
#   theme source <= 250ms, first prompt <= 400ms, re-render <= 120ms,
#   hard fail at 5x budget, per-phase hard cap 5s.
# The 2026-10-02 baseline (scripts/perf/baselines/
# asset-timing-baseline.json, 437 assets, niu 1.3.3 / rubash 646237e93532,
# Win10 19044, 4 workers) shows the class defaults BELOW had to be ratified
# above those targets: the oh-my-bash / bash-it loaders themselves cost
# ~350-1000ms of source wall on Windows (per-file sourcing + real-time
# scanner), and the ConPTY first-prompt window carries 1.5-2.5s of transport
# batching on this machine. Ratifying the baseline is the ratchet, not an
# amnesty: numbers may only go DOWN from here without owner sign-off, and
# the mandated targets remain the fix-lane goal. Deleting a ratified default
# restores the mandate for that class immediately.

schema = "niubash:perf-asset-budgets@1.0.0"
updated = "2026-10-02"
phase_timeout_s = 5.0
hard_fail_multiplier = 5

[defaults]
# Ratified from the baseline p90 of each class (median noted per class in
# the comment; rerender keeps the mandated 120ms — the baseline says healthy
# themes re-render in 11-35ms, so 120 still has teeth).
# omb.theme      src med 1004 / p90 1105; fp med 2749
"omb.theme"         = { source_ms = 1400, first_prompt_ms = 4200, rerender_ms = 120 }
# bashit.theme   src med 698 / p90 878; fp med 970
"bashit.theme"      = { source_ms = 1050, first_prompt_ms = 1800, rerender_ms = 120 }
# omb.alias      src med 701; fp med 2092
"omb.alias"         = { source_ms = 800, first_prompt_ms = 2600, rerender_ms = 120 }
# omb.plugin     src med 735 / p90 925; fp med 2243
"omb.plugin"        = { source_ms = 1050, first_prompt_ms = 3200, rerender_ms = 120 }
# omb.completion src med 712 / p90 1009; fp med 2131
"omb.completion"    = { source_ms = 1250, first_prompt_ms = 2800, rerender_ms = 120 }
# bashit.alias   src med ~360; fp med ~490
"bashit.alias"      = { source_ms = 500, first_prompt_ms = 700, rerender_ms = 120 }
# bashit.plugin  src med 362 / p90 395; fp med 485
"bashit.plugin"     = { source_ms = 450, first_prompt_ms = 800, rerender_ms = 120 }
# bashit.completion src med 370 / p90 510; fp med 498
"bashit.completion" = { source_ms = 600, first_prompt_ms = 1150, rerender_ms = 120 }

# Per-asset overrides — table key = "<class>:<name>". Every entry carries a
# justification referencing the committed baseline. The baseline run of
# 2026-10-02 (niu 1.3.3, rubash git 646237e93532, Win10 19044, workers=4)
# is scripts/perf/baselines/asset-timing-baseline.json.
[assets]
# ── Ratified single-asset stragglers over their class p90 (baseline ±15%).
# These are ordinary heavy assets, not bugs; do not raise further.
"omb.theme:developer" = { budget = { source_ms = 1920 }, justification = "baseline 1424ms source; theme sets its own prompt machinery; fix-lane candidate to reach the 250ms mandate" }
"omb.theme:dulcie" = { budget = { source_ms = 2060 }, justification = "baseline 1526ms source (p90 1105)" }
"omb.completion:svn" = { budget = { source_ms = 1950 }, justification = "baseline 1443ms source; svn completion is the heaviest omb.completion (p90 1009)" }
"bashit.theme:dulcie" = { budget = { source_ms = 1680 }, justification = "baseline 1244ms source (p90 878)" }
"bashit.completion:dirs" = { budget = { source_ms = 2060, first_prompt_ms = 1590 }, justification = "baseline 1524ms source / 1176ms first prompt (class p90 510/753); dirs completion rebuilds its index at load" }
"bashit.completion:django" = { budget = { source_ms = 2110, first_prompt_ms = 1680 }, justification = "baseline 1560ms source / 1244ms first prompt; heaviest bash-it completion" }
"bashit.completion:dmidecode" = { budget = { source_ms = 910 }, justification = "baseline 676ms source" }
"bashit.completion:docker-compose" = { budget = { source_ms = 1300 }, justification = "baseline 966ms source" }
"bashit.completion:hub" = { budget = { source_ms = 950 }, justification = "baseline 706ms source" }
"bashit.completion:npm" = { budget = { source_ms = 920 }, justification = "baseline 683ms source" }
"bashit.plugin:alias-completion" = { budget = { source_ms = 740 }, justification = "baseline 549ms source; scans all enabled aliases at load" }
"bashit.plugin:node" = { budget = { source_ms = 950, first_prompt_ms = 1090 }, justification = "baseline 706ms source / 804ms first prompt; probes node --version at load" }
"bashit.plugin:sshagent" = { budget = { source_ms = 720 }, justification = "baseline 535ms source" }
"bashit.plugin:thefuck" = { budget = { source_ms = 810 }, justification = "baseline 602ms source" }

