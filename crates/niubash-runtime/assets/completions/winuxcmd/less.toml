long = "--quit-at-eof"
description = "quit after second EOF"

[[flags]]
short = "-E"
long = "--QUIT-AT-EOF"
description = "quit after first EOF"

[[flags]]
short = "-F"
long = "--quit-if-one-screen"
description = "quit if entire file fits on first screen"

[[flags]]
short = "-i"
long = "--ignore-case"
description = "ignore case in searches that do not contain uppercase"

[[flags]]
short = "-I"
long = "--IGNORE-CASE"
description = "ignore case in all searches"

[[flags]]
short = "-K"
long = "--quit-on-intr"
description = "exit less in response to Ctrl+C"

[[flags]]
short = "-n"
long = "--line-numbers"
description = "display line number at start of each line"

[[flags]]
short = "-N"
long = "--LINE-NUMBERS"
description = "display line number at start of each line"

[[flags]]
short = "-S"
long = "--chop-long-lines"
description = "chop long lines (do not wrap)"

[[flags]]
short = "-q"
long = "--quiet"
description = "accepted placeholder; terminal bell is not used"

[[flags]]
short = "-Q"
long = "--QUIET"
description = "accepted placeholder; terminal bell is not used"

[[flags]]
short = "-r"
long = "--raw-control-chars"
description = "accepted placeholder; control chars are passed through"

[[flags]]
short = "-R"
